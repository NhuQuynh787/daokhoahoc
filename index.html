<style>
:root{--ink:#15344a;--teal:#087f8c;--deep:#07566b;--mint:#c8f7dc;--sun:#ffd166;--coral:#ff8066;--paper:#fffdf4;--line:#d6e9e7;--shadow:0 12px 28px #073b4c20}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#b9f0f3,#eaf9e9 52%,#fff3cb);min-height:100vh}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 16px;font-weight:800;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:focus-visible{outline:3px solid #ff9f1c;outline-offset:3px}.primary{background:var(--teal);color:white}.secondary{background:#e1f5ee;color:var(--deep)}.gold{background:var(--sun);color:#563c05}.danger{background:#ffe4dc;color:#8e3427}.hidden{display:none!important}.wrap{max-width:1120px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0}.brand{font-weight:1000;letter-spacing:.3px;font-size:clamp(1rem,2vw,1.35rem)}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffffc9;border:1px solid #ffffff;padding:7px 12px;border-radius:999px;font-weight:800;font-size:.9rem}.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(24px,5vw,52px);background:linear-gradient(135deg,#076b7a,#19a5a0 55%,#8de0a9);color:white;box-shadow:var(--shadow);min-height:280px}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-45px;bottom:-150px;background:#ffffff24;border:25px solid #ffffff20}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-weight:900;color:#d3ffed}.hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin:12px 0;max-width:700px}.hero p{max-width:650px;font-size:1.08rem;line-height:1.6}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.scene{font-size:clamp(4rem,10vw,7rem);position:absolute;right:8%;top:24px;filter:drop-shadow(0 10px 5px #03485a44);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}.panel{background:var(--paper);border:1px solid #fff;border-radius:24px;padding:clamp(16px,3vw,26px);box-shadow:var(--shadow);margin-top:18px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.section-head h2{margin:0}.muted{color:#587381}.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.zone{position:relative;min-height:170px;text-align:left;padding:18px;background:linear-gradient(145deg,#fff,#e9f8ee);border:2px solid var(--line);border-radius:22px;color:var(--ink);box-shadow:0 5px 0 #d0e8df}.zone .emoji{font-size:2.6rem}.zone h3{margin:5px 0}.zone p{margin:0;color:#587381;font-size:.93rem}.zone.locked{filter:grayscale(.7);opacity:.65;cursor:not-allowed}.zone.done{border-color:#40b875;background:linear-gradient(145deg,#f3fff3,#d8f9df)}.zone .status{position:absolute;right:12px;top:12px;font-size:.85rem;font-weight:900;background:#fff;padding:5px 9px;border-radius:999px}.progressbar{height:12px;background:#dbece6;border-radius:999px;overflow:hidden;margin-top:10px}.progressbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#00a896,#83d86e);transition:width .3s}.gamegrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;margin-top:18px}.question-card{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,30px);min-height:370px}.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#5b7782;font-weight:800;font-size:.9rem}.question-card h2{font-size:clamp(1.2rem,2.5vw,1.65rem);line-height:1.4}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.opt{background:#f2faf7;border:2px solid #d6e9e7;color:var(--ink);text-align:left;min-height:58px}.opt.selected{border-color:var(--teal);background:#d9f8f0}.opt.correct{background:#d7f8dc;border-color:#43ae69}.opt.wrong{background:#ffe1d9;border-color:#e77c66}.feedback{padding:14px;border-radius:16px;margin:14px 0;line-height:1.5}.feedback.good{background:#e0f8e6;border:1px solid #a9e3b6}.feedback.bad{background:#fff0dd;border:1px solid #f3cf8d}.sidebox{background:#e8f8f2;border-radius:20px;padding:18px;height:max-content}.sidebox .bot{font-size:3rem}.sidebox h3{margin:4px 0}.sidebox p{line-height:1.5}.hint{background:#fff3cb;border-radius:12px;padding:12px;margin-top:12px}.draglist{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.dragitem{background:#e1f4ff;border:2px solid #a9d7e9;padding:10px 12px;border-radius:12px;font-weight:800;cursor:grab}.dropzones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dropzone{min-height:105px;border:2px dashed #9dc9c5;border-radius:16px;padding:12px;background:#f6fffb}.dropzone strong{display:block;margin-bottom:7px}.dropzone.over{background:#e0f8e6}.placed{display:flex;flex-wrap:wrap;gap:5px}.placed button{font-size:.82rem;padding:6px 9px;background:#d8f2e7}.orderlist{display:grid;gap:8px;margin:16px 0}.orderitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px;background:#eff9f6;border-radius:12px;font-weight:750}.orderitem button{padding:6px 10px;background:#d7ece5}.matchgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.matchgrid button{background:#f1f8ff;border:2px solid #d0e4ee;min-height:74px}.matchgrid button.picked{border-color:var(--teal);background:#d8f7ef}.matchgrid button.matched{border-color:#4dbd78;background:#e1f9e6}.explainbox{margin-top:12px}.explainbox textarea{width:100%;min-height:85px;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit}.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.result-card{background:#f0faf4;border-radius:16px;padding:15px}.result-card strong{display:block}.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.badge{background:#fff1b8;border:1px solid #f3d77b;border-radius:14px;padding:12px;font-weight:900}.footer{text-align:center;padding:26px 12px;color:#35616a;font-weight:900}.small{font-size:.88rem}.notice{padding:12px;background:#fff5d6;border-radius:12px;margin-top:12px}@media(max-width:760px){.scene{right:12px;top:auto;bottom:10px;opacity:.55}.hero p{max-width:100%}.gamegrid{grid-template-columns:1fr}.sidebox{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.map{grid-template-columns:1fr}.options,.dropzones,.matchgrid,.result-grid{grid-template-columns:1fr}.question-card{min-height:unset}.wrap{padding:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<header class="topbar"><div class="brand">🏝️ ĐẢO KHOA HỌC</div><div class="stats"><span class="pill">⭐ Điểm: <b id="scoreTop">0</b></span><span class="pill">🧭 Nhiệm vụ: <b id="doneTop">0/24</b></span><button id="soundBtn" class="secondary" aria-pressed="false">🔔 Âm thanh: Tắt</button></div></header>

<script>
"use strict";
const $=s=>document.querySelector(s);
const zones=[
{id:"flower",name:"Khu Vườn Hoa",emoji:"🌺",desc:"Khám phá sinh sản ở thực vật có hoa.",color:"flower"},
{id:"seed",name:"Rừng Cây Con",emoji:"🌱",desc:"Giải mã hạt nảy mầm và cây con.",color:"seed"},
{id:"animal",name:"Trang Trại Động Vật",emoji:"🐣",desc:"Tìm hiểu các hình thức sinh sản.",color:"animal"},
{id:"life",name:"Thung Lũng Vòng Đời",emoji:"🦋",desc:"Khám phá các giai đoạn phát triển.",color:"life"}];
const Q=(zone,type,level,prompt,answer,explain,opts=[],extra={})=>({zone,type,level,prompt,answer,explain,opts,...extra});
const bank=[
Q("flower","mc","Nhận biết","Bộ phận nào của hoa thường tạo ra hạt sau khi thụ tinh?","Noãn","Sau thụ tinh, noãn phát triển thành hạt; bầu nhụy thường phát triển thành quả.",["Cánh hoa","Noãn","Đài hoa","Cuống hoa"]),
Q("flower","mc","Nhận biết","Thụ phấn là quá trình nào?","Hạt phấn chuyển đến đầu nhụy","Thụ phấn là sự chuyển hạt phấn đến đầu nhụy; đây chưa phải là thụ tinh.",["Hạt phấn chuyển đến đầu nhụy","Tinh tử kết hợp với tế bào trứng","Hạt bắt đầu nảy mầm","Quả phát tán hạt"]),
Q("flower","tf","Thông hiểu","Đúng hay sai: Thụ phấn và thụ tinh là cùng một quá trình.","Sai","Thụ phấn là hạt phấn đến đầu nhụy. Thụ tinh là sự kết hợp của tế bào sinh dục đực và tế bào trứng.",[],{statement:true}),
Q("flower","mc","Thông hiểu","Sau khi hoa được thụ tinh, bộ phận nào thường phát triển thành quả?","Bầu nhụy","Bầu nhụy thường phát triển thành quả, còn noãn phát triển thành hạt.",["Đầu nhụy","Bầu nhụy","Cánh hoa","Chỉ nhị"]),
Q("flower","sort","Nhận biết","Sắp xếp các bước sinh sản hữu tính ở thực vật có hoa theo trình tự đơn giản.","Thụ phấn → Thụ tinh → Hình thành hạt và quả","Hạt phấn đến đầu nhụy trước, sau đó mới diễn ra thụ tinh; rồi hạt và quả hình thành.",[],{items:["Hình thành hạt và quả","Thụ tinh","Thụ phấn"],correctOrder:["Thụ phấn","Thụ tinh","Hình thành hạt và quả"]}),
Q("flower","scenario","Vận dụng","Bạn muốn quan sát hoa bí tạo quả. Việc nào giúp quá trình thụ phấn diễn ra thuận lợi?","Bảo vệ côn trùng thụ phấn và tránh làm hỏng hoa","Một số côn trùng chuyển hạt phấn giữa các hoa. Không làm hại hoa và côn trùng giúp hỗ trợ thụ phấn.",["Bứt hết hoa","Phun thuốc tùy tiện lên hoa","Bảo vệ côn trùng thụ phấn và tránh làm hỏng hoa","Che kín hoa bằng túi không thông khí"]),
Q("seed","mc","Nhận biết","Điều kiện thường cần để hạt nảy mầm là gì?","Đủ nước, không khí và nhiệt độ thích hợp","Phần lớn hạt cần nước, ô-xi trong không khí và nhiệt độ phù hợp để nảy mầm; mỗi loài có yêu cầu riêng.",["Ánh sáng mạnh trong mọi trường hợp","Đủ nước, không khí và nhiệt độ thích hợp","Phân bón thật đậm đặc","Đất thật khô"]),
Q("seed","tf","Thông hiểu","Đúng hay sai: Hạt nảy mầm và cây lớn lên là một quá trình hoàn toàn giống nhau.","Sai","Nảy mầm là giai đoạn hạt bắt đầu phát triển thành cây mầm; sinh trưởng là quá trình cây tiếp tục lớn lên và phát triển.",[],{statement:true}),
Q("seed","sort","Nhận biết","Sắp xếp quá trình phát triển đơn giản từ hạt thành cây.","Hạt hút nước → Rễ mầm xuất hiện → Chồi mầm phát triển → Cây con","Khi gặp điều kiện phù hợp, hạt hút nước; rễ mầm thường xuất hiện trước, sau đó chồi phát triển.",[],{items:["Cây con","Hạt hút nước","Chồi mầm phát triển","Rễ mầm xuất hiện"],correctOrder:["Hạt hút nước","Rễ mầm xuất hiện","Chồi mầm phát triển","Cây con"]}),
Q("seed","mc","Thông hiểu","Một bạn đặt hạt đậu trên bông ẩm nhưng ngập trong nước nhiều ngày. Vì sao hạt có thể khó nảy mầm?","Hạt thiếu không khí","Hạt cần nước nhưng cũng cần ô-xi. Ngập nước lâu có thể làm hạt thiếu không khí.",["Hạt không cần nước","Hạt thiếu không khí","Hạt luôn cần phân bón trước khi nảy mầm","Hạt chỉ nảy mầm trong bóng tối tuyệt đối"]),
Q("seed","classify","Thông hiểu","Phân loại các yếu tố thành “Cần cho phần lớn hạt nảy mầm” và “Không phải điều kiện bắt buộc chung”.","Cần: nước, không khí, nhiệt độ thích hợp; Không bắt buộc chung: ánh sáng","Nhiều hạt có thể nảy mầm không cần ánh sáng, nhưng cần nước, ô-xi và nhiệt độ thích hợp.",[],{items:["Nước","Không khí","Nhiệt độ thích hợp","Ánh sáng"],categories:["Cần cho phần lớn hạt nảy mầm","Không phải điều kiện bắt buộc chung"],mapping:{"Nước":"Cần cho phần lớn hạt nảy mầm","Không khí":"Cần cho phần lớn hạt nảy mầm","Nhiệt độ thích hợp":"Cần cho phần lớn hạt nảy mầm","Ánh sáng":"Không phải điều kiện bắt buộc chung"}}),
Q("seed","scenario","Vận dụng","Em gieo hạt đậu trong cốc đất khô và tưới rất ít. Hạt chưa nảy mầm. Em nên làm gì trước tiên?","Tưới lượng nước vừa đủ để đất ẩm, không úng","Nước giúp hạt hút nước và khởi động quá trình nảy mầm; tránh để hạt khô hoặc ngập úng.",["Bón thật nhiều phân","Tưới lượng nước vừa đủ để đất ẩm, không úng","Đặt cốc vào tủ kín","Đào hạt lên mỗi giờ"]),
Q("animal","mc","Nhận biết","Động vật nào sau đây đẻ trứng?","Gà","Gà sinh sản bằng cách đẻ trứng; chó, mèo và bò thường đẻ con.",["Chó","Mèo","Gà","Bò"]),
Q("animal","classify","Nhận biết","Phân loại động vật theo cách sinh sản thường gặp.","Đẻ trứng: gà, rùa; Đẻ con: mèo, cá heo","Gà và rùa đẻ trứng; mèo và cá heo là động vật có vú, sinh con.",[],{items:["Gà","Rùa","Mèo","Cá heo"],categories:["Đẻ trứng","Đẻ con"],mapping:{"Gà":"Đẻ trứng","Rùa":"Đẻ trứng","Mèo":"Đẻ con","Cá heo":"Đẻ con"}}),
Q("animal","tf","Thông hiểu","Đúng hay sai: Tất cả động vật sống dưới nước đều đẻ trứng.","Sai","Nhiều loài cá đẻ trứng, nhưng cá heo là động vật có vú và đẻ con. Không thể chỉ dựa vào nơi sống để kết luận.",[],{statement:true}),
Q("animal","match","Thông hiểu","Ghép mỗi con vật với hình thức sinh sản phù hợp.","Gà–đẻ trứng; Mèo–đẻ con; Ếch–đẻ trứng; Bò–đẻ con","Đây là hình thức sinh sản thường gặp của các loài được nêu.",[],{pairs:[["🐔 Gà","Đẻ trứng"],["🐱 Mèo","Đẻ con"],["🐸 Ếch","Đẻ trứng"],["🐄 Bò","Đẻ con"]]}),
Q("animal","mc","Thông hiểu","Vì sao không nên nói “mọi loài cá đều đẻ trứng” như một quy tắc tuyệt đối?","Vì có một số loài cá sinh con","Đa số loài cá đẻ trứng, nhưng có loài sinh con; cần tránh khẳng định tuyệt đối khi có ngoại lệ.",["Vì cá không sinh sản","Vì có một số loài cá sinh con","Vì mọi loài cá đều đẻ con","Vì cá chỉ sinh sản trên cạn"]),
Q("animal","scenario","Vận dụng","Nhà em nuôi gà mái đang ấp trứng. Cách làm nào phù hợp?","Để ổ ấp yên tĩnh, sạch và hạn chế làm phiền","Ổ ấp cần được giữ an toàn, phù hợp và ít bị quấy rối; không nên liên tục di chuyển trứng.",["Lắc trứng mỗi ngày","Để ổ ấp yên tĩnh, sạch và hạn chế làm phiền","Tưới nước trực tiếp lên trứng","Liên tục cầm trứng lên xem"]),
Q("life","mc","Nhận biết","Vòng đời của bướm thường có trình tự nào?","Trứng → Sâu bướm → Nhộng → Bướm trưởng thành","Bướm trải qua biến thái hoàn toàn với bốn giai đoạn chính.",["Trứng → Nhộng → Sâu bướm → Bướm","Trứng → Sâu bướm → Nhộng → Bướm trưởng thành","Sâu bướm → Trứng → Bướm → Nhộng","Trứng → Bướm trưởng thành → Nhộng"]),
Q("life","sort","Nhận biết","Sắp xếp các giai đoạn phát triển của ếch theo thứ tự.","Trứng → Nòng nọc → Ếch con → Ếch trưởng thành","Nòng nọc nở từ trứng, phát triển chân và dần biến đổi thành ếch con rồi ếch trưởng thành.",[],{items:["Ếch trưởng thành","Nòng nọc","Trứng","Ếch con"],correctOrder:["Trứng","Nòng nọc","Ếch con","Ếch trưởng thành"]}),
Q("life","match","Thông hiểu","Ghép con vật với đặc điểm vòng đời.","Bướm–có giai đoạn nhộng; Ếch–nòng nọc; Gà–gà con; Châu chấu–con non giống dạng trưởng thành","Các loài có vòng đời khác nhau. Châu chấu phát triển qua trứng, con non và trưởng thành, không có giai đoạn nhộng.",[],{pairs:[["🦋 Bướm","Có giai đoạn nhộng"],["🐸 Ếch","Có giai đoạn nòng nọc"],["🐔 Gà","Có giai đoạn gà con"],["🦗 Châu chấu","Con non giống dạng trưởng thành"]]}),
Q("life","tf","Thông hiểu","Đúng hay sai: Châu chấu có giai đoạn nhộng giống bướm.","Sai","Châu chấu phát triển qua biến thái không hoàn toàn: trứng, con non và con trưởng thành; không có giai đoạn nhộng.",[],{statement:true}),
Q("life","mc","Thông hiểu","Gà con khác gà trưởng thành ở điểm nào phù hợp nhất?","Gà con còn đang lớn và chưa phát triển hoàn toàn","Gà con lớn dần, phát triển lông và cơ thể; nó không trải qua giai đoạn nhộng như bướm.",["Gà con phải trải qua giai đoạn nhộng","Gà con còn đang lớn và chưa phát triển hoàn toàn","Gà con là một loài khác","Gà con không thể lớn lên"]),
Q("life","scenario","Vận dụng","Em tìm thấy nòng nọc trong ao. Nhận định nào đúng nhất?","Nòng nọc là giai đoạn phát triển của ếch","Nòng nọc là giai đoạn ấu trùng sống dưới nước của ếch; sau đó cơ thể thay đổi để thành ếch.",["Nòng nọc là một loài chim","Nòng nọc là giai đoạn phát triển của ếch","Nòng nọc là trứng của cá","Nòng nọc là giai đoạn nhộng của bướm"]),
Q("life","scenario","Vận dụng","Một bạn nói sâu bướm sẽ lớn lên bằng cách trở thành nhộng rồi thành bướm. Bạn ấy đang mô tả vòng đời của con vật nào?","Bướm","Sâu bướm là giai đoạn ấu trùng của bướm; tiếp theo là nhộng rồi bướm trưởng thành.",["Ếch","Gà","Bướm","Châu chấu"])
];
bank.forEach((q,i)=>q.id=i);
let state={screen:"start",score:0,done:new Set(),unlocked:0,currentZone:0,order:[],qIndex:0,activeQ:null,answered:false,answers:[],attempts:{},sound:false,sessionId:0};
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function save(){try{sessionStorage.setItem("daoKhoaHocProgress",JSON.stringify({score:state.score,done:[...state.done],unlocked:state.unlocked,answers:state.answers,attempts:state.attempts,sessionId:state.sessionId}))}catch(e){}}
function load(){try{const x=JSON.parse(sessionStorage.getItem("daoKhoaHocProgress")||"null");if(x){state.score=x.score||0;state.done=new Set(x.done||[]);state.unlocked=x.unlocked||0;state.answers=x.answers||[];state.attempts=x.attempts||{};state.sessionId=x.sessionId||0}}catch(e){}}
function sync(){ $("#scoreTop").textContent=state.score;$("#doneTop").textContent=`${state.done.size}/24`; }
function speak(text){if(!state.sound||!("speechSynthesis"in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="vi-VN";u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
function go(screen){state.screen=screen;render()}
function render(){sync();if(state.screen==="start")renderStart();else if(state.screen==="map")renderMap();else if(state.screen==="game")renderGame();else if(state.screen==="result")renderResult()}
function renderStart(){$("#app").innerHTML=`<section class="hero"><div class="scene" aria-hidden="true">🤖</div><div class="eyebrow">Cuộc phiêu lưu tri thức · Lớp 5</div><h1>ĐẢO KHOA HỌC<br>THỬ THÁCH SINH TỒN</h1><p>Chào nhà thám hiểm! Hãy cùng robot Bíp khám phá thực vật và động vật, giải mã những bí mật của sự sống và mở kho báu tri thức.</p><div class="hero-actions"><button class="gold" id="startBtn">🚀 Bắt đầu khám phá</button><button class="secondary" id="guideBtn">📘 Hướng dẫn chơi</button></div></section><section class="panel"><div class="section-head"><div><h2>🗺️ Nhiệm vụ của nhà thám hiểm</h2><p class="muted">4 khu vực · 24 thử thách · 4 huy hiệu</p></div><span class="pill">🌿 Khoa học lớp 5</span></div><div class="notice">Mỗi khu vực có 6 nhiệm vụ. Đọc câu hỏi, chọn hoặc sắp xếp câu trả lời, rồi xem giải thích khoa học. Trả lời thử lại không bị trừ điểm và mỗi nhiệm vụ chỉ nhận điểm một lần.</div></section><section class="panel hidden" id="guide"><h2>📘 Cách chơi</h2><ul><li>Chọn khu vực đang mở trên bản đồ.</li><li>Hoàn thành nhiệm vụ để mở khóa khu vực tiếp theo.</li><li>Với câu đúng/sai, hãy đọc lời giải thích; với kéo–thả, chọn thẻ rồi chọn ô phân loại.</li><li>Điểm chỉ cộng lần đầu hoàn thành đúng; tốc độ không ảnh hưởng điểm.</li><li>Cuối hành trình, xem kết quả từng mạch kiến thức và gợi ý ôn tập.</li></ul><button class="primary" id="closeGuide">Đã hiểu</button></section>`;$("#startBtn").onclick=()=>go("map");$("#guideBtn").onclick=()=>$("#guide").classList.toggle("hidden");$("#closeGuide").onclick=()=>$("#guide").classList.add("hidden")}
function renderMap(){const pct=Math.round(state.done.size/24*100);$("#app").innerHTML=`<section class="hero"><div class="scene">🧭</div><div class="eyebrow">Bản đồ hành trình</div><h1>Chọn điểm đến!</h1><p>Robot Bíp đang chờ em. Hoàn thành từng vùng để mở đường tới kho báu cuối đảo.</p><div class="progressbar"><span style="width:${pct}%"></span></div><p class="small">${state.done.size}/24 nhiệm vụ hoàn thành · ${pct}% hành trình</p></section><section class="panel"><div class="section-head"><h2>🏝️ Bản đồ đảo tương tác</h2><span class="pill">Huy hiệu: ${Math.min(state.unlocked,4)}/4</span></div><div class="map">${zones.map((z,i)=>`<button class="zone ${i>state.unlocked?"locked":""} ${zoneDone(i)?"done":""}" data-zone="${i}" ${i>state.unlocked?"disabled":""}><span class="status">${zoneDone(i)?"✅ Hoàn thành":i>state.unlocked?"🔒 Chưa mở":"▶ Khám phá"}</span><div class="emoji">${z.emoji}</div><h3>${i+1}. ${z.name}</h3><p>${z.desc}</p><p class="small">${zoneCount(i)} / 6 nhiệm vụ</p></button>`).join("")}</div><div class="controls"><button class="secondary" id="homeBtn">🏠 Trang đầu</button><button class="gold" id="finishBtn" ${state.done.size<24?"disabled":""}>🏆 Mở kho báu</button></div></section>`;document.querySelectorAll("[data-zone]").forEach(b=>b.onclick=()=>startZone(+b.dataset.zone));$("#homeBtn").onclick=()=>go("start");$("#finishBtn").onclick=()=>go("result")}
function zoneCount(i){return [...state.done].filter(id=>bank[id]?.zone===zones[i].id).length}
function zoneDone(i){return zoneCount(i)>=6}
function startZone(i){state.currentZone=i;const z=zones[i].id;state.order=shuffle(bank.map((q,idx)=>({...q,id:idx})).filter(q=>q.zone===z).map(q=>q.id));state.qIndex=0;state.answered=false;state.activeQ=null;go("game");nextQuestion()}
function nextQuestion(){if(state.qIndex>=state.order.length){state.unlocked=Math.max(state.unlocked,Math.min(state.currentZone+1,3));save();go("map");return}state.activeQ=bank[state.order[state.qIndex]];state.answered=state.done.has(state.activeQ.id);renderGame()}
function qBase(q){return `<div class="qmeta"><span>${zones[state.currentZone].emoji} ${zones[state.currentZone].name}</span><span>Nhiệm vụ ${state.qIndex+1}/6 · ${q.level}</span></div><h2>${q.prompt}</h2>`}
function renderGame(){const q=state.activeQ;if(!q)return;let body="";if(q.type==="mc"||q.type==="scenario"){body=`<div class="options">${shuffle(q.opts).map((o,i)=>`<button class="opt" data-opt="${esc(o)}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>`}
else if(q.type==="tf"){body=`<p class="pill">${esc(q.statement? q.prompt.replace("Đúng hay sai: ",""):"")}</p><div class="options"><button class="opt" data-opt="Đúng">✅ Đúng</button><button class="opt" data-opt="Sai">❌ Sai</button></div><div class="explainbox"><label for="why"><b>Vì sao em chọn như vậy?</b> (khuyến khích)</label><textarea id="why" placeholder="Viết ngắn gọn cách em suy nghĩ..."></textarea></div>`}
else if(q.type==="sort"){body=`<p class="muted">Dùng nút ↑ ↓ để đưa các bước về đúng trình tự.</p><div class="orderlist" id="orderlist">${shuffle(q.items).map((x,i)=>`<div class="orderitem" data-item="${esc(x)}"><span>${i+1}. ${esc(x)}</span><span><button data-up>↑</button> <button data-down>↓</button></span></div>`).join("")}</div><button class="primary" id="checkOrder">Kiểm tra trình tự</button>`}
else if(q.type==="classify"){body=`<p class="muted">Chọn một thẻ bên dưới, sau đó chọn ô phân loại phù hợp. Mỗi thẻ có một vị trí chính xác.</p><div class="draglist">${q.items.map(x=>`<button class="dragitem" data-item="${esc(x)}">${esc(x)}</button>`).join("")}</div><div class="dropzones">${q.categories.map(c=>`<div class="dropzone" data-cat="${esc(c)}"><strong>${esc(c)}</strong><div class="placed" data-placed="${esc(c)}"></div></div>`).join("")}</div><p id="classStatus" class="muted small">Chưa phân loại thẻ nào.</p><button class="primary" id="checkClass">Kiểm tra phân loại</button>`}
else if(q.type==="match"){body=`<p class="muted">Chọn một con vật ở cột trái rồi chọn khái niệm phù hợp ở cột phải.</p><div class="matchgrid" id="matchgrid">${q.pairs.map((p,i)=>`<button data-left="${i}">${p[0]}</button>`).join("")}${shuffle(q.pairs.map((p,i)=>({v:p[1],i}))).map(x=>`<button data-right="${x.i}">${x.v}</button>`).join("")}</div><p id="matchStatus" class="muted small">Đã ghép 0/${q.pairs.length} cặp.</p><button class="primary" id="checkMatch">Kiểm tra ghép cặp</button>`}
if(state.answered)body+=`<div class="feedback good"><b>Đã hoàn thành nhiệm vụ này.</b><br>${esc(q.explain)}</div>`;
$("#app").innerHTML=`<section class="panel"><div class="section-head"><div><h2>🧪 Thử thách khoa học</h2><p class="muted">Đọc kỹ, suy nghĩ và khám phá lời giải.</p></div><span class="pill">⭐ ${state.score} điểm</span></div><div class="progressbar"><span style="width:${state.qIndex/6*100}%"></span></div><div class="gamegrid"><section class="question-card">${qBase(q)}${body}<div id="feedback"></div><div class="controls"><button class="secondary" id="hintBtn">💡 Gợi ý</button><button class="primary" id="nextBtn" ${state.answered?"":"disabled"}>${state.qIndex===5?"Về bản đồ ➜":"Nhiệm vụ tiếp ➜"}</button></div><div id="hint" class="hint hidden">${esc(hintFor(q))}</div></section><aside class="sidebox"><div class="bot">🤖</div><div><h3>Robot Bíp</h3><p>“Không sao nếu em cần thử lại! Hãy tìm bằng chứng khoa học rồi giải thích lựa chọn của mình nhé.”</p><p class="small">🏅 Huy hiệu khu vực khi hoàn thành 6 nhiệm vụ.</p></div></aside></div></section>`;
wireQuestion(q)}
function hintFor(q){if(q.type==="mc"||q.type==="scenario")return "Hãy loại bỏ những phương án không liên quan đến quá trình sinh học được hỏi. Nhớ phân biệt điều kiện cần với yếu tố chỉ có ích trong một số trường hợp.";if(q.type==="tf")return "Tách từng khái niệm ra và tự hỏi: hai quá trình này xảy ra ở cùng thời điểm hay có ý nghĩa khác nhau?";if(q.type==="sort")return "Bắt đầu từ giai đoạn sớm nhất, sau đó theo dõi điều gì xuất hiện hoặc phát triển tiếp theo.";if(q.type==="classify")return "Phân loại theo đặc điểm khoa học của từng mục, không dựa riêng vào nơi sống hay vẻ ngoài.";return "Tìm mối liên hệ trực tiếp giữa tên con vật và đặc điểm vòng đời/hình thức sinh sản."}
function wireQuestion(q){$("#hintBtn").onclick=()=>$("#hint").classList.toggle("hidden");$("#nextBtn").onclick=()=>{state.qIndex++;nextQuestion()};document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>answerSimple(q,b.dataset.opt,b));if(q.type==="sort"){$("#orderlist").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveOrder(b,-1));$("#orderlist").querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveOrder(b,1));$("#checkOrder").onclick=()=>{const a=[...$("#orderlist").children].map(x=>x.dataset.item);const ok=a.every((x,i)=>x===q.correctOrder[i]);showFeedback(ok,q.explain,ok?5:0);if(ok)complete(q,5);$("#nextBtn").disabled=!ok}}
if(q.type==="classify"){let selected=null,placed={};document.querySelectorAll(".dragitem").forEach(b=>b.onclick=()=>{selected=b.dataset.item;document.querySelectorAll(".dragitem").forEach(x=>x.classList.toggle("selected",x===b));$("#classStatus").textContent=`Đã chọn: ${selected}. Chọn ô phân loại.`});document.querySelectorAll(".dropzone").forEach(z=>z.onclick=()=>{if(!selected)return;placed[selected]=z.dataset.cat;z.querySelector(".placed").innerHTML=Object.keys(placed).filter(k=>placed[k]===z.dataset.cat).map(k=>`<button data-remove="${esc(k)}">${esc(k)} ✕</button>`).join("");z.querySelectorAll("[data-remove]").forEach(x=>x.onclick=e=>{e.stopPropagation();delete placed[x.dataset.remove];wirePlaced()});selected=null;document.querySelectorAll(".dragitem").forEach(x=>x.classList.remove("selected"));$("#classStatus").textContent=`Đã phân loại ${Object.keys(placed).length}/${q.items.length} thẻ.`});function wirePlaced(){document.querySelectorAll("[data-placed]").forEach(p=>p.innerHTML=Object.keys(placed).filter(k=>placed[k]===p.dataset.placed).map(k=>`<button data-remove="${esc(k)}">${esc(k)} ✕</button>`).join(""));document.querySelectorAll("[data-remove]").forEach(x=>x.onclick=e=>{e.stopPropagation();delete placed[x.dataset.remove];wirePlaced()})}$("#checkClass").onclick=()=>{const ok=q.items.every(x=>placed[x]===q.mapping[x]);showFeedback(ok,q.explain,ok?5:0);if(ok)complete(q,5);$("#nextBtn").disabled=!ok}}
if(q.type==="match"){let left=null,pairs={};document.querySelectorAll("[data-left]").forEach(b=>b.onclick=()=>{left=+b.dataset.left;document.querySelectorAll("[data-left]").forEach(x=>x.classList.toggle("picked",x===b))});document.querySelectorAll("[data-right]").forEach(b=>b.onclick=()=>{if(left===null)return;pairs[left]=+b.dataset.right;left=null;document.querySelectorAll("[data-left]").forEach(x=>x.classList.remove("picked"));$("#matchStatus").textContent=`Đã chọn ${Object.keys(pairs).length}/${q.pairs.length} cặp.`});$("#checkMatch").onclick=()=>{const ok=q.pairs.every((p,i)=>pairs[i]===i);showFeedback(ok,q.explain,ok?5:0);if(ok)complete(q,5);$("#nextBtn").disabled=!ok}}}
function moveOrder(btn,delta){const row=btn.closest(".orderitem"),parent=row.parentElement,idx=[...parent.children].indexOf(row),to=idx+delta;if(to<0||to>=parent.children.length)return;if(delta<0)parent.insertBefore(row,parent.children[to]);else parent.insertBefore(parent.children[to],row);[...parent.children].forEach((el,i)=>el.querySelector("span").textContent=`${i+1}. ${el.dataset.item}`)}
function answerSimple(q,choice,btn){const correct=q.type==="tf"?choice===q.answer:choice===q.answer;document.querySelectorAll("[data-opt]").forEach(x=>{x.disabled=true;if((q.type==="tf"?x.dataset.opt===q.answer:x.dataset.opt===q.answer))x.classList.add("correct")});if(!correct)btn.classList.add("wrong");showFeedback(correct,q.explain,correct?5:0);if(correct)complete(q,5);else{const f=$("#feedback");f.innerHTML+=`<p>Em có thể xem gợi ý rồi thử lại ở lượt chơi sau. Hãy nhớ: không bị trừ điểm.</p><button class="secondary" id="retryBtn">Thử lại câu này</button>`;$("#retryBtn").onclick=()=>{state.answered=false;renderGame()}}}
function showFeedback(ok,explain,points){const f=$("#feedback");f.innerHTML=`<div class="feedback ${ok?"good":"bad"}"><b>${ok?"🎉 Chính xác! +"+points+" điểm":"🧠 Chưa chính xác, hãy thử lại nhé."}</b><br>${esc(explain)}</div>`;speak(ok?"Chính xác! "+explain:"Hãy thử lại nhé. "+explain)}
function complete(q,points){if(state.done.has(q.id))return;state.done.add(q.id);state.score+=points;state.answers.push({id:q.id,zone:q.zone,correct:true,level:q.level});state.answered=true;save();sync();$("#nextBtn").disabled=false;const fb=$("#feedback");if(fb&&!fb.innerHTML.includes("Chính xác"))fb.innerHTML=`<div class="feedback good"><b>🎉 Hoàn thành! +${points} điểm</b><br>${esc(q.explain)}</div>`;if(zoneCount(state.currentZone)===6){state.unlocked=Math.max(state.unlocked,Math.min(state.currentZone+1,3));save()}}
function renderResult(){const by=zones.map(z=>{const qs=bank.filter(q=>q.zone===z.id),done=qs.filter(q=>state.done.has(q.id)).length;return{...z,done,total:qs.length}});const weak=by.filter(z=>z.done<z.total);$("#app").innerHTML=`<section class="hero"><div class="scene">🏆</div><div class="eyebrow">Hành trình hoàn tất</div><h1>${state.done.size===24?"Kho báu tri thức đã mở!":"Bảng tổng kết nhà thám hiểm"}</h1><p>${state.done.size===24?"Tuyệt vời! Em đã hoàn thành toàn bộ thử thách về thực vật và động vật.":"Em có thể xem kết quả hiện tại và tiếp tục các khu vực còn lại trên bản đồ."}</p><div class="hero-actions"><span class="pill">⭐ ${state.score} điểm</span><span class="pill">✅ ${state.done.size}/24 nhiệm vụ</span><span class="pill">🏅 ${by.filter(z=>z.done===z.total).length}/4 huy hiệu</span></div></section><section class="panel"><h2>📊 Kết quả theo mạch kiến thức</h2><div class="result-grid">${by.map(z=>`<div class="result-card"><strong>${z.emoji} ${z.name}</strong><p>${z.done}/${z.total} nhiệm vụ hoàn thành</p><div class="progressbar"><span style="width:${z.done/z.total*100}%"></span></div><p class="small">${z.done===z.total?"Đã vững vàng!": "Nên luyện tập thêm mạch kiến thức này."}</p></div>`).join("")}</div><div class="notice"><b>🌟 Gợi ý ôn tập</b><ul>${weak.length?weak.map(z=>`<li>${z.name}: quay lại bản đồ và hoàn thành các nhiệm vụ còn thiếu.</li>`).join(""):`<li>Ôn lại sự khác nhau giữa thụ phấn và thụ tinh.</li><li>Giải thích điều kiện cần cho hạt nảy mầm.</li><li>So sánh đẻ trứng, đẻ con và các vòng đời khác nhau.</li>`}<li>Thử giải thích bằng lời của mình vì sao chọn đáp án, không chỉ ghi nhớ đáp án.</li></ul></div><div class="controls"><button class="secondary" id="mapAgain">🗺️ Về bản đồ</button><button class="primary" id="replay">🔄 Chơi lại từ đầu</button></div></section>`;$("#mapAgain").onclick=()=>go("map");$("#replay").onclick=resetGame}
function resetGame(){state.score=0;state.done=new Set();state.unlocked=0;state.answers=[];state.attempts={};state.sessionId++;save();go("map")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("#soundBtn").onclick=()=>{state.sound=!state.sound;$("#soundBtn").textContent=`${state.sound?"🔊":"🔔"} Âm thanh: ${state.sound?"Bật":"Tắt"}`;$("#soundBtn").setAttribute("aria-pressed",String(state.sound));if(!state.sound&&"speechSynthesis"in window)speechSynthesis.cancel()};
load();render();
</script>
</body>
</html>
